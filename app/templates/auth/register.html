{% from "_macros.html" import form_field %}
{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto bg-surface border border-border-subtle rounded-lg shadow-sm p-6">
    <h1 class="text-2xl font-serif font-semibold text-text-primary mb-4">Register</h1>
    <form method="POST">
        {{ form.hidden_tag() }}
        {{ form_field(form.username) }}
        {{ form_field(form.password) }}
        {{ form_field(form.confirm_password) }}
        <button type="submit" class="inline-flex items-center rounded-md bg-btn-primary px-4 py-2 text-sm font-medium
         text-white shadow-sm hover:bg-btn-primary-hover">Register</button>
    </form>
</div>
{% endblock content %}
