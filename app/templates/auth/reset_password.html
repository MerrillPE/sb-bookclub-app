{% from "_macros.html" import form_field %}
{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto bg-white border border-stone-200 rounded-lg shadow-sm p-6">
    <h1 class="text-2xl font-serif font-semibold text-stone-900 mb-4">Set New Password</h1>
    <form method="POST">
        {{ form.hidden_tag() }}
        {{ form_field(form.password) }}
        {{ form_field(form.confirm_password) }}
        <button type="submit" class="inline-flex items-center rounded-md bg-amber-700 px-4 py-2 text-sm font-medium
         text-white shadow-sm hover:bg-amber-800">Set New Password</button>
    </form>
</div>
{% endblock content %}
