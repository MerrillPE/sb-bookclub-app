{% from "_macros.html" import form_field %}
{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto bg-white border border-stone-200 rounded-lg shadow-sm p-6">
    <h1 class="text-2xl font-serif font-semibold text-stone-900 mb-4">Log In</h1>
    <form method="POST">
        {{ form.hidden_tag() }}
        {{ form_field(form.username) }}
        {{ form_field(form.password) }}
        <button type="submit" class="inline-flex items-center rounded-md bg-amber-700 px-4 py-2 text-sm font-medium
         text-white shadow-sm hover:bg-amber-800">Log In</button>
    </form>

    <div data-inline-edit class="mt-4">
        <div data-inline-edit-view>
            <button type="button" data-inline-edit-trigger class="text-sm text-stone-500 hover:text-stone-700 underline">Have an invite token?</button>
        </div>
        <div data-inline-edit-panel class="hidden mt-2">
            <form id="invite-token-form" class="flex items-center gap-2">
                <input type="text" name="token" aria-label="Invite token" placeholder="Invite token"
                       class="block w-full rounded-md border-stone-300 shadow-sm focus:border-amber-600 focus:ring-amber-600 sm:text-sm">
                <button type="submit" class="flex-none inline-flex items-center rounded-md bg-amber-700 px-3 py-2 text-sm font-medium text-white shadow-sm hover:bg-amber-800">Go</button>
                <button type="button" data-inline-edit-cancel class="flex-none text-sm text-stone-500 hover:text-stone-700 underline">Cancel</button>
            </form>
        </div>
    </div>

    <div data-inline-edit class="mt-2">
        <div data-inline-edit-view>
            <button type="button" data-inline-edit-trigger class="text-sm text-stone-500 hover:text-stone-700 underline">Have a password reset token?</button>
        </div>
        <div data-inline-edit-panel class="hidden mt-2">
            <form id="reset-token-form" class="flex items-center gap-2">
                <input type="text" name="token" aria-label="Password reset token" placeholder="Reset token"
                       class="block w-full rounded-md border-stone-300 shadow-sm focus:border-amber-600 focus:ring-amber-600 sm:text-sm">
                <button type="submit" class="flex-none inline-flex items-center rounded-md bg-amber-700 px-3 py-2 text-sm font-medium text-white shadow-sm hover:bg-amber-800">Go</button>
                <button type="button" data-inline-edit-cancel class="flex-none text-sm text-stone-500 hover:text-stone-700 underline">Cancel</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
