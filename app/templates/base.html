<!DOCTYPE html>
<html lang='en'>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}Spine Busters Book Club{% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
    </head>
    <body class="bg-stone-50 text-stone-700">
        <nav class="bg-stone-900 text-white px-4 py-3">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
                <a href="{{ url_for('home') }}" class="text-lg font-semibold">Spine Busters Book Club</a>
            </div>
        </nav>
        <main class="max-w-4xl mx-auto px-4 py-8">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="mb-4 rounded-md bg-rose-50 border border-rose-200 p-3 text-sm text-rose-700">
                        <ul>
                        {% for message in messages %}
                            <li>{{ message }}</li>
                        {% endfor %}
                        </ul>
                    </div>
                {% endif %}
            {% endwith %}
            {% block content %}{% endblock %}
        </main>
        <script type="module" src={{ url_for('static', filename='js/main.js') }}></script>
    </body>
</html>
